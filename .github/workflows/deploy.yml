name: Fintech API CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js Environment
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Project Dependencies
      run: npm install

    - name: Build Docker Image
      run: |
        docker build -t banking-api:${{ github.sha }} .

    - name: Test Docker Container Run
      run: |
        docker run -d -p 5000:5000 --name test-app banking-api:${{ github.sha }}
        sleep 3
        curl http://localhost:5000/health
